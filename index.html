<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>桃園社大 志工報名</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f4f2; --card:#ffffff; --ink:#1f1e1b; --muted:#4f4a47; --line:#e8dfdc;
    --green:#b8406f; --green-ink:#ffffff; --green-soft:#fbe9f0;
    --orange:#a8501a; --orange-soft:#fbeee3;
    --red:#b3261e; --chip:#f7e8ee; --chip-me:#ffe9a8; --wait:#f0ebe0;
    --staff-bg:#f3f1ec; --staff-ink:#3d3a34; --staff-line:#d9d4c8;
    --tbl:#e8dfdc; --tbl-h:#fcf8f7; --gather:#a8385f;
    --shadow:0 1px 2px rgba(40,35,20,.08),0 2px 10px rgba(40,35,20,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1a1916; --card:#262420; --ink:#f1ede4; --muted:#bdb6a6; --line:#3b3830;
      --green:#e8789f; --green-ink:#2a0f19; --green-soft:#3a2230;
      --orange:#f2a65a; --orange-soft:#3a2a1a;
      --red:#ff8a80; --chip:#3a2a31; --chip-me:#5a4a14; --wait:#34312a;
      --staff-bg:#2c2a26; --staff-ink:#d8d2c6; --staff-line:#45413a;
      --tbl:#463c3f; --tbl-h:#2e2629; --gather:#f08aaa;
      --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1a1916; --card:#262420; --ink:#f1ede4; --muted:#bdb6a6; --line:#3b3830;
    --green:#e8789f; --green-ink:#2a0f19; --green-soft:#3a2230;
    --orange:#f2a65a; --orange-soft:#3a2a1a;
    --red:#ff8a80; --chip:#3a2a31; --chip-me:#5a4a14; --wait:#34312a; --shadow:none;
    --staff-bg:#2c2a26; --staff-ink:#d8d2c6; --staff-line:#45413a;
    --tbl:#463c3f; --tbl-h:#2e2629; --gather:#f08aaa;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    font-size:19px;line-height:1.55}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}
  button{font:inherit;cursor:pointer}

  header{padding:22px 0 10px}
  h1{font-size:25px;margin:0;letter-spacing:.04em;line-height:1.2}
  .nw{white-space:nowrap;display:inline-block}   /* 字太大放不下時，整組「志工報名」換到下一行，不會拆開 */
  .brand{display:flex;gap:12px;align-items:center}
  .logo{flex:0 0 auto;width:50px;height:50px;border-radius:15px;background:var(--green);color:#fff;font-weight:700;font-size:17px;display:grid;place-items:center;letter-spacing:.06em}
  .org{margin:2px 0 0;font-size:14px;color:var(--muted);letter-spacing:.04em}
  .sub{margin-top:12px !important}
  .sub{color:var(--muted);margin:4px 0 0;font-size:15px}
  .heart{color:var(--ink);font-family:Arial,"Chiron GoRound TC",sans-serif}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 4px;
    color:var(--muted);font-size:16px}
  .refresh{border:1.5px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:8px 16px;font-size:17px;white-space:nowrap;flex:0 0 auto}
  .demo{background:var(--orange-soft);color:var(--orange);border-radius:12px;padding:10px 14px;
    font-size:16px;margin-top:12px}

  .day{margin-top:26px}
  .day-h{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0 8px;
    display:flex;align-items:baseline;gap:10px;font-weight:700;font-size:23px}
  .rel{font-size:16px;font-weight:700;color:var(--green);background:var(--green-soft);
    border-radius:999px;padding:2px 10px}

  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);
    border:1px solid var(--line);padding:18px 18px 16px;margin-top:12px}
  .card.mine{border:2px solid var(--green)}
  .title{font-size:21px;font-weight:700;margin:0 0 10px;line-height:1.4}
  .row{display:flex;gap:10px;margin:4px 0}
  .row .k{flex:0 0 4.6em;color:var(--muted)}
  .row .v{flex:1;min-width:0}
  .gather .v{color:var(--orange);font-weight:700}
  .map{display:inline-block;margin-top:4px;color:var(--green);font-weight:700;font-size:17px;text-decoration:none;
    border:1.5px solid var(--green);border-radius:999px;padding:2px 12px}
  .months{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:8px 16px;scrollbar-width:none;position:sticky;top:0;z-index:6;background:var(--bg)}
  .months::-webkit-scrollbar{display:none}
  .mon{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;
    min-height:52px;padding:0 18px;font-size:20px;font-weight:700}
  #main{min-height:100vh}   /* 場次少的月份也能停在月份按鈕下方 */
  #main.slide-l{animation:slideL .28s ease}
  #main.slide-r{animation:slideR .28s ease}
  @keyframes slideL{from{opacity:.3;transform:translateX(40px)}to{opacity:1;transform:none}}
  @keyframes slideR{from{opacity:.3;transform:translateX(-40px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){#main.slide-l,#main.slide-r{animation:none}}
  .mon small{font-weight:400;font-size:15px;color:var(--muted);margin-left:4px}
  .mon.on{background:var(--green);border-color:var(--green);color:var(--green-ink)}
  .mon.on small{color:var(--green-ink);opacity:.85}
  .note{margin-top:8px;font-size:17px;color:var(--muted)}

  .who{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .count{font-weight:700;margin-bottom:8px}
  .count .need{color:var(--muted);font-weight:400}
  .count .full{color:var(--orange)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--chip);border-radius:999px;padding:4px 14px;font-size:18px}
  .chip.me{background:var(--chip-me);font-weight:700}
  .staff{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--staff-bg)}
  .staff .lbl{font-size:16px;font-weight:700;color:var(--staff-ink);margin-bottom:6px}
  .chip.st{background:var(--card);border:1.5px solid var(--staff-line);color:var(--staff-ink)}
  .chip.wait{background:var(--wait);color:var(--muted)}
  .empty{color:var(--muted);font-size:17px}

  .act{display:flex;gap:10px;margin-top:14px}
  .btn{border:0;border-radius:14px;min-height:56px;padding:0 18px;font-size:20px;font-weight:700}
  .btn-go{flex:1;background:var(--green);color:var(--green-ink)}
  .btn-cancel{background:transparent;color:var(--muted);border:1.5px solid var(--line);font-weight:400;font-size:18px}
  .closed{margin-top:14px;color:var(--muted);background:var(--wait);border-radius:12px;padding:10px 14px;font-size:17px}
  .done{margin-top:14px;color:var(--green);font-weight:700;font-size:18px}

  /* 底部彈出視窗 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);
    border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    max-width:640px;margin:0 auto;transform:translateY(105%);transition:transform .22s ease,visibility .22s;visibility:hidden;
    max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}   /* 內容太長（字體調大）可以在視窗裡上下捲 */
  .open .mask{display:block}
  .open .sheet{transform:none;visibility:visible}
  .sheet h2{margin:0 0 4px;font-size:22px}
  .sheet .ctx{color:var(--muted);margin:0 0 16px;font-size:18px}
  .sheet label{display:block;font-weight:700;margin-bottom:8px}
  .sheet input{width:100%;font:inherit;font-size:24px;padding:12px 14px;border-radius:12px;
    border:2px solid var(--line);background:var(--bg);color:var(--ink)}
  .sheet input:focus{outline:none;border-color:var(--green)}
  .err{color:var(--red);min-height:1.5em;margin:8px 0 0;font-size:17px}
  .sheet .btn{width:100%;margin-top:10px}
  .btn-back{background:transparent;color:var(--muted);border:1.5px solid var(--line);font-weight:400}
  .btn-danger{background:var(--red);color:#fff}
  .pick{display:grid;gap:10px}
  .pick button{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--bg);
    color:var(--ink);font-size:21px;text-align:left;padding:0 16px}
  .pick button.me{border-color:var(--green)}

  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(150%);
    background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:999px;font-weight:700;
    z-index:30;transition:transform .25s ease,opacity .25s;max-width:calc(100% - 32px);text-align:center;width:max-content;opacity:0;pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  .loading{text-align:center;color:var(--muted);padding:60px 0}

  /* 後台 */
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 4px}
  .tab{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
    padding:8px 16px;font-size:17px;white-space:nowrap}
  .tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .admin-note{font-size:16px;color:var(--muted);margin-top:10px}
  .log{width:100%;border-collapse:collapse;font-size:16px;margin-top:12px;background:var(--card);
    border-radius:12px;overflow:hidden}
  .log th,.log td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .log th{background:var(--wait);font-weight:700}
  .log td:nth-child(-n+3),.log th{white-space:nowrap}
  .tag{display:inline-block;border-radius:6px;padding:0 8px;font-weight:700}
  .tag.in{background:var(--green-soft);color:var(--green)}
  .tag.out{background:var(--orange-soft);color:var(--orange)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .filters input,.filters select{font:inherit;font-size:17px;padding:8px 10px;border-radius:10px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-width:0;flex:1}
  textarea{width:100%;min-height:300px;font:inherit;font-size:17px;padding:12px;border-radius:12px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-top:10px}
  .tablewrap{overflow-x:auto}
  /* 月曆 */
  .cal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 6px 8px;margin-top:12px}
  .cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
  .cal-w{text-align:center;font-size:15px;color:var(--muted);padding-bottom:4px}
  .cal-w.sun,.cal-d.sun .n{color:var(--red)}
  .cal-d{min-height:64px;border-radius:8px;border:0;background:transparent;color:var(--ink);padding:3px 2px;
    display:flex;flex-direction:column;align-items:stretch;gap:2px;font:inherit;text-align:left;min-width:0}
  .cal-d .n{font-size:15px;line-height:1.2;text-align:center}
  .cal-d.has{background:var(--bg);cursor:pointer}
  .cal-d.has .n{font-weight:700}
  .cal-d .ev{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
    font-size:11.5px;line-height:1.25;font-weight:700;background:var(--green-soft);color:var(--green);
    border-radius:4px;padding:2px 3px;word-break:break-all;max-height:calc(3.75em + 4px)}
  .cal-d .ev.mine{background:var(--chip-me);color:var(--ink)}
  .cal-d .more{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
  .cal-d.today{box-shadow:inset 0 0 0 2px var(--ink)}
  .cal-d.gone{opacity:.4}
  .cal-d:disabled{cursor:default}
  .cal-leg{display:flex;gap:14px;justify-content:center;font-size:14px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
  .cal-leg i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
  @media (min-width:560px){ .cal-d{min-height:84px} .cal-d .ev{font-size:13px} }
  /* 週曆 */
  .views{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:16px;background:var(--wait);border-radius:14px;padding:4px}
  .views button{min-height:48px;border:0;border-radius:11px;background:transparent;font-size:18px;color:var(--muted)}
  .views button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
  .wnav{display:flex;gap:8px;align-items:center;margin-top:14px}
  .wnav button{flex:0 0 auto;min-height:56px;min-width:6.2em;border-radius:14px;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink);font-size:17px;font-weight:700;line-height:1.2;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:4px 10px}
  .wnav button small{font-size:13px;font-weight:400;color:var(--green)}
  .wnav button:disabled{opacity:.35}
  .wnav .lbl{flex:1;text-align:center;font-weight:700;font-size:20px;line-height:1.3}
  .back-now{display:block;margin:8px auto 0;background:none;border:0;color:var(--green);text-decoration:underline;font-size:16px;padding:6px}
  .wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
  .wd{border:0;border-radius:12px;background:transparent;color:var(--muted);padding:6px 0;display:flex;flex-direction:column;
    align-items:center;font:inherit;min-height:66px}
  .wd .w{font-size:14px}
  .wd .dn{font-size:19px;font-weight:700;line-height:1.2}
  .wd .c{font-size:12px;font-weight:700;min-height:1.2em}
  .wd.has{background:var(--green-soft);color:var(--ink);cursor:pointer}
  .wd.has .c{color:var(--green)}
  .wd.mine{background:var(--chip-me)}
  .wd.today{box-shadow:inset 0 0 0 2px var(--ink)}
  .wd.gone{opacity:.45}
  .empty-day{display:flex;gap:12px;align-items:baseline;padding:12px 4px;border-bottom:1px dashed var(--line);color:var(--muted);font-size:17px}
  .empty-day b{color:var(--ink);min-width:6.2em;font-size:19px}
  .empty-day.gone{opacity:.5}
  .wk .day{margin-top:14px}
  .wk .day-h{font-size:21px;padding:6px 0}
  .wk .card{padding:14px 14px 12px;margin-top:6px}
  .wk .title{font-size:19px;margin-bottom:6px}
  .wk .row{margin:2px 0;font-size:17px}
  .wk .row .k{flex-basis:4.4em}
  .wk .staff{margin-top:8px;padding:6px 10px}
  .wk .staff .lbl{font-size:15px;margin-bottom:4px}
  .wk .who{margin-top:8px;padding-top:8px}
  .wk .count{margin-bottom:6px;font-size:17px}
  .wk .chip{font-size:16px;padding:2px 11px}
  .wk .act{margin-top:10px}
  .wk .btn{min-height:50px;font-size:18px}
  .wk .note{font-size:16px;margin-top:4px}
  /* 扁長方形列表 */
  .dg{margin-top:12px}
  .wk .dg{margin-top:8px}
  .rc{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-top:6px;overflow:hidden}
  .rc.mine{border:2px solid var(--green)}
  .rc.picked{border:2.5px solid var(--green);background:var(--green-soft)}
  .rc-top{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:8px;padding:9px 8px 9px 4px;cursor:pointer;align-items:start}
  .rc-date{text-align:center;line-height:1.15;border-right:1px solid var(--line);padding-right:6px}
  .rc-date b{display:block;font-size:19px}
  .rc-date span{display:block;font-size:14px;color:var(--muted)}
  .rc-date .rl{display:inline-block;font-style:normal;font-size:12px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:0 6px}
  .rc-date em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:4px}
  .rc-date strong{display:block;font-size:17px;color:var(--orange)}
  .rc-title{font-weight:700;font-size:17.5px;line-height:1.3}
  .rc-line .tm{color:var(--ink)}
  .rc-line{font-size:15.5px;color:var(--muted);line-height:1.35;margin-top:2px}
  .rc-line.st{color:var(--staff-ink)}
  .rc-line.vol{color:var(--ink)}
  .rc-line .me{background:var(--chip-me);font-weight:700;border-radius:4px;padding:0 3px}
  .rc-line .hit{outline:2px solid var(--orange);border-radius:4px;font-weight:700;padding:0 2px}
  .rc-line small{color:var(--muted);font-size:13px}
  .rc-line .none{color:var(--muted)}
  .rc-side{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px}
  .qbtn{min-width:60px;min-height:50px;border-radius:12px;border:0;background:var(--green);color:var(--green-ink);
    font-size:18px;font-weight:700;padding:0 8px;line-height:1.15}
  .qbtn.cx{background:var(--card);color:var(--muted);border:1.5px solid var(--line);font-size:15px;font-weight:400;min-height:48px}
  .qbtn.pick{background:var(--card);color:var(--green);border:2px solid var(--green)}
  .qbtn.pick.on{background:var(--green);color:var(--green-ink)}
  .qtag{font-size:14px;font-weight:700;color:var(--muted);text-align:center;padding:6px 2px;line-height:1.25}
  .qtag.ok{color:var(--green);font-size:15px}
  .more-t{font-size:13px;color:var(--muted);white-space:nowrap}
  .rc.exp .rc-top{background:var(--bg)}
  .rc-more{padding:8px 12px 12px;border-top:1px dashed var(--line)}
  .rc-more .row{font-size:17px}
  .cal-toggle{display:block;width:100%;margin-top:10px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink);font-size:17px}
  /* 表格式列表 */
  .tb{margin-top:12px;background:var(--card);border:1px solid var(--tbl);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(40,35,20,.06)}
  .tb.soon{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
  .tb.soon .tb-h{background:var(--green-soft)}
  .tb-h{background:var(--tbl-h);font-weight:700;font-size:18px;padding:8px 14px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--tbl)}
  .tb-h .rel{font-size:14px;padding:0 8px}
  .ev+.ev{border-top:1.5px solid var(--tbl)}
  .ev-top{display:grid;grid-template-columns:auto minmax(0,1fr);cursor:pointer}
  .ev-t{border-right:1.5px solid var(--tbl);padding:8px 4px;text-align:center;line-height:1.2;min-width:62px;white-space:nowrap}   /* 長輩把手機字調大時，時間欄會跟著變寬，不會壓到標題 */
  .ev-t{font-variant-numeric:tabular-nums}
  .ev-t span.only{margin-top:0;font-size:15px;color:var(--ink);font-weight:700}
  .ev-t .vl{display:block;width:2px;height:7px;margin:3px auto;background:currentColor;opacity:.5;border-radius:1px}
  .ev-t b{display:block;color:var(--gather);font-size:19px;letter-spacing:.01em}
  .ev-t small{display:block;color:var(--gather);font-size:12px;font-weight:700}
  .ev-t span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
  .ev-b{padding:8px 10px;min-width:0}
  .ev-h{display:flex;gap:8px;align-items:flex-start}
  .ev-title{flex:1;min-width:0;font-weight:700;font-size:18px;line-height:1.3}
  .ev-p{font-size:16px;color:var(--muted);margin-top:2px;line-height:1.3}
  .ev-c{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px}
  .cnt{font-size:14.5px;font-weight:700;border-radius:999px;padding:1px 10px;background:var(--wait);color:var(--ink)}
  .cnt.lack{background:var(--orange-soft);color:var(--orange)}
  .cnt.ok{background:var(--green-soft);color:var(--green)}
  .cnt.me{background:var(--chip-me);color:var(--ink)}
  .cnt.hitc{background:transparent;outline:2px solid var(--orange);color:var(--orange)}
  .dt{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}

  .ce{min-height:1.45em;outline:none;border-radius:4px;cursor:text;white-space:pre-wrap;word-break:break-word}

  .howto{background:var(--green-soft);border-radius:10px;padding:8px 12px;margin:6px 0}

<body>
<div class="wrap">
  <header>
    <h1><span class="nw">桃園社大</span> <span class="nw">志工報名</span></h1>
    <p class="sub" id="sub">想幫忙哪一場，按「我要報名」，填名字就好 <span class="heart">♥︎</span></p>
    <div id="demo"></div>
    <div class="tabs" id="tabs" hidden></div>
    <div class="search" id="searchBox" hidden>
      <span class="sicon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
      <input id="q" type="search" enterkeyhint="search" placeholder="打名字、活動或地點" oninput="onSearch(this.value)">
      <button id="qClear" onclick="clearSearch()" hidden>清除</button>
    </div>
    <div class="qhint" id="qHint" hidden></div>
    <div class="bar">
      <span id="updated">讀取中…</span>
      <button class="refresh" onclick="load()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="vertical-align:-2px;margin-right:4px"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>重新整理</button>
    </div>
  </header>
  <main id="main"><div class="loading">活動載入中，請稍等…</div></main>
  <div class="foot" id="foot"></div>
</div>

<div id="modal">
  <div class="mask" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast"></div>
<div class="mbar" id="mbar" hidden></div>
<script type="application/json" id="boot">null</script>

<script>
/* =========================================================
   與 Google Apps Script 溝通；在 GAS 以外開啟時自動進入「示範模式」
   ========================================================= */
var IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
/* 放在 GitHub 時：填 Apps Script 部署的網址（結尾是 /exec）。放在 Apps Script 裡用時，這行不用管 */
var API_URL = 'https://script.google.com/macros/s/AKfycbwjiP6abarq3-eshI44ztl8DrKfSTC0Pr2lwKsLslFh_YZP6EMhnIHtFaUAHf_9F0vp/exec';   // ← Apps Script 部署網址（結尾 /exec）
var STATE = { data: null, adminKey: '', tab: 'list', busy: false, multi: false, sel: {}, open: {}, showCal: false };
var WEEK = ['日','一','二','三','四','五','六'];

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    if (IS_GAS) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(new Error((e && e.message) || '連線失敗，請再試一次'));
      });
      if (typeof r[fn] !== 'function') { reject(new Error('系統更新不完整：Code.gs 是舊版，請工作人員貼上最新的 Code.gs 並「部署新版本」')); return; }
      r[fn].apply(r, args);
    } else if (API_URL) {   // GitHub 版：透過網路跟 Apps Script 要資料
      fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.ok) resolve(j.data);
          else if (j && j.error === '不支援的動作') reject(new Error('系統更新不完整：Code.gs 是舊版，請工作人員貼上最新的 Code.gs 並「部署新版本」'));
          else reject(new Error((j && j.error) || '連線失敗，請再試一次'));
        })
        .catch(function () { reject(new Error('連線失敗，請檢查網路後再試一次')); });
    } else {
      setTimeout(function () {
        try { resolve(Mock[fn].apply(null, args)); } catch (e) { reject(e); }
      }, 250);
    }
  });
}

/* ---------- 名字記在這支手機上，下次自動帶入 ---------- */
function myName() { try { return localStorage.getItem('vol_name') || ''; } catch (e) { return ''; } }
function saveName(n) { try { localStorage.setItem('vol_name', n); } catch (e) {} }
function clean(s) { return String(s || '').replace(/\s+/g, ''); }

/* ---------- 日期顯示 ---------- */
function parts(d) { var p = d.split('-'); return { y: +p[0], m: +p[1], d: +p[2] }; }
function dayLabel(d) { var p = parts(d); return p.m + '/' + p.d + '（' + WEEK[new Date(p.y, p.m - 1, p.d).getDay()] + '）'; }
function diffDays(a, b) { var A = parts(a), B = parts(b);
  return Math.round((new Date(B.y, B.m - 1, B.d) - new Date(A.y, A.m - 1, A.d)) / 864e5); }
function relLabel(d) { var n = diffDays(STATE.data.today, d);
  return n === 0 ? '今天' : n === 1 ? '明天' : n === 2 ? '後天' : ''; }

/* 放進 onclick 的參數一律用這個，避免名字裡的引號被當成程式 */
function jsArg(x) { return esc(JSON.stringify(String(x == null ? '' : x))); }

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

/* ---------- 載入 ---------- */
function load(silent) {
  if (!silent) document.getElementById('updated').textContent = '讀取中…';
  return call('getData', STATE.adminKey).then(function (d) {
    STATE.data = d;
    // 自動更新（切回分頁、每 30 秒）時，正在填表單、排工作、查詢的畫面不重畫，免得打到一半被清空
    if (silent && !safeToRender()) { document.getElementById('updated').textContent = '最後更新 ' + d.updatedAt; return; }
    render();
  }).catch(function (e) {
    if (!silent) document.getElementById('main').innerHTML = '<div class="loading">讀取失敗：' + esc(e.message) + '<br>請按「重新整理」</div>';
  });
}

/* 只有「活動列表」而且沒有在打字、沒有開著視窗時，才可以自動重畫 */
function safeToRender() {
  if (STATE.tab !== 'list' && STATE.tab !== 'past') return false;
  if (document.getElementById('modal').className) return false;
  var a = document.activeElement;
  if (a && a.id !== 'q' && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable)) return false;
  return true;
}
function render() {
  document.body.classList.remove('wide');
  var d = STATE.data;
  document.getElementById('updated').textContent = '最後更新 ' + d.updatedAt;
  renderTabs();
  document.getElementById('foot').innerHTML = d.isAdmin
    ? '<button onclick="doLogout()">登出後台</button>'
    : '<button onclick="openLogin()">工作人員登入</button>';
  var listy = STATE.tab === 'list' || STATE.tab === 'past' || !d.isAdmin;
  document.getElementById('searchBox').hidden = !listy;
  drawHint(listy);
  drawBar();   // 先決定底部按鈕要不要顯示（只有活動列表需要）
  if (d.isAdmin && STATE.tab === 'log') return renderLog();
  if (d.isAdmin && STATE.tab === 'hours') return renderHours();
  if (d.isAdmin && STATE.tab === 'plan') return STATE.planEvent ? renderPlan() : renderPlanPick();
  if (d.isAdmin && STATE.tab === 'remind') return renderRemind();
  if (d.isAdmin && STATE.tab === 'recruit') return renderRecruit();
  if (d.isAdmin && STATE.tab === 'add') return renderForm(null);
  if (d.isAdmin && STATE.tab === 'edit') return renderForm(STATE.editing);
  drawBar();
  if (d.isAdmin && STATE.tab === 'past') return renderList(true);
  renderList(false);
}

/* ---------- 志工看到的活動列表 ---------- */
function renderList(past) {
  var d = STATE.data, me = myName(), html = '', lastDate = '';
  var list = past ? (d.past || []) : d.events, key = past ? 'pastMonth' : 'month';
  if (!list.length) { document.getElementById('main').innerHTML = '<div class="loading">' + (past ? '近一年沒有過去的活動' : '目前沒有開放登記的活動') + '</div>'; return; }
  var months = [];
  list.forEach(function (e) { var m = e.date.slice(0, 7); if (months.indexOf(m) < 0) months.push(m); });
  if (months.indexOf(STATE[key]) < 0) STATE[key] = months[0];
  var cur = STATE[key];
  var q = searchKey();
  if (q) {   // 有搜尋時：跨月份全部找，不分頁
    var hits = list.filter(function (e) { return matchEvent(e, q) && (past || !STATE.multi || canPick(e)); });
    html += '<p class="result">找到 ' + hits.length + ' 場' +
      (!hits.length ? '<small>換個關鍵字試試，例如只打名字的其中一個字</small>' :
        hits.some(function (e) { return (e.names || []).concat(e.staff || []).some(isHit); }) ? '<small>符合的名字會用橘色框標出來</small>' : '') + '</p>';
    html += rowsHTML(hits, me);
    document.getElementById('main').innerHTML = html;
    return;
  }
  if (!past && STATE.multi) {   // 選場次模式：只列出還能報名的場次，所有月份一次列出來
    var can = list.filter(canPick), mineN = me && !(STATE.data && STATE.data.isAdmin) ? list.filter(function (e) { return e.names.indexOf(me) >= 0 && e.open; }).length : 0;
    html += multiHTML();
    if (mineN) html += '<p class="admin-note">你已經報名的 ' + mineN + ' 場不會出現在這裡。</p>';
    if (!can.length) html += '<div class="loading">目前沒有可以報名的場次</div>';
    var cm = []; can.forEach(function (e) { var m = e.date.slice(0, 7); if (cm.indexOf(m) < 0) cm.push(m); });
    cm.forEach(function (m) {
      html += '<h2 class="mon-h">' + (+m.slice(5)) + '月</h2>' + rowsHTML(can.filter(function (e) { return e.date.slice(0, 7) === m; }), me);
    });
    document.getElementById('main').innerHTML = html;
    return;
  }
  if (!past) html += multiHTML();
  var thisYear = d.today.slice(0, 4);
  STATE._months = months; STATE._past = !!past;
  html += '<div id="monAnchor"></div><nav class="months">' + months.map(function (m) {
    var cnt = list.filter(function (e) { return e.date.slice(0, 7) === m; }).length;
    var label = (m.slice(0, 4) !== thisYear ? m.slice(0, 4) + '年' : '') + (+m.slice(5)) + '月';
    return '<button class="mon' + (m === cur ? ' on' : '') + '" onclick="pickMonth(' + jsArg(m) + ',' + (past ? 1 : 0) + ')">' + label + '<small>' + cnt + '場</small></button>';
  }).join('') + '</nav>';
  if (past) html += '<p class="admin-note">只有工作人員看得到。顯示近一年、已經結束的活動，以及最後的名單。</p>';
  html += rowsHTML(list.filter(function (e) { return e.date.slice(0, 7) === cur; }), me);
  document.getElementById('main').innerHTML = html;
}
/* ---------- 搜尋 ---------- */
function shortDay(ds) { var p = parts(ds); return p.m + '/' + p.d; }
function searchKey() { return clean(STATE.q || '').toLowerCase(); }
function isHit(name) { var q = searchKey(); return !!q && String(name).toLowerCase().indexOf(q) >= 0; }
function matchEvent(e, q) {
  // 只比對活動內容和人名；日期只用「11/5」這種寫法（不放「11月」「（四）」，否則打「月」「四」會每場都符合）
  var text = [e.title, e.place, e.address, e.note, shortDay(e.date)]
    .concat(e.names || [], e.staff || []).join(' ').replace(/\s+/g, '').toLowerCase();
  return text.indexOf(q) >= 0;
}
var searchTimer;
/* 搜尋框下方的一行小提示；開始打字就收起來 */
function drawHint(show) {
  var h = document.getElementById('qHint');
  if (show === undefined) show = !document.getElementById('searchBox').hidden;
  if (!show || STATE.q || STATE.tab === 'past' || (STATE.data && STATE.data.isAdmin)) { h.hidden = true; return; }
  var me = myName(), n = me ? STATE.data.events.filter(function (e) { return e.names.concat(e.staff || []).some(function (x) { return x.indexOf(me) >= 0; }); }).length : 0;   // 跟搜尋結果的算法一樣
  h.hidden = false;
  h.innerHTML = n
    ? '<span>' + esc(me) + '，你有 ' + n + ' 場</span><button onclick="searchMe()">看我的報名 ›</button>'
    : '<span>打自己的名字，可以查你報了哪幾場；打活動名稱或地點，可以找場次。</span>';
}
function searchMe() { var i = document.getElementById('q'); i.value = myName(); onSearch(i.value); window.scrollTo(0, 0); }

function onSearch(v) {
  STATE.q = v;
  document.getElementById('qClear').hidden = !v;
  drawHint();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function () { renderList(STATE.tab === 'past'); }, 150);
}
function clearSearch() { var i = document.getElementById('q'); i.value = ''; onSearch(''); }

var ICON = {
  plus: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" style="vertical-align:-4px;margin-right:6px"><path d="M12 5v14M5 12h14"/></svg>',
  undo: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
  pin: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'
};
/* ---------- 我要報名（可一次選很多場） ---------- */
function multiHTML() {
  if (!STATE.multi) return '';
  if ((STATE.data && STATE.data.isAdmin)) return '<div class="multi-tip">幫志工報名：先勾場次（一場或很多場都可以，截止、額滿的也可以），再按最下方的按鈕填名字（一位或很多位都可以）。</div>';
  return '<div class="multi-tip">這裡只會列出<b>還能報名</b>的場次。<br>請按每一場右上角的「☐ 選」，想參加幾場就選幾場，下個月的也可以一起選。<br>選好後按最下方的粉紅色按鈕填名字。</div>';
}

/* ---------- 月曆 ---------- */
function calendarHTML(list, ym, past) {
  var y = +ym.slice(0, 4), m = +ym.slice(5, 7), me = myName(), today = STATE.data.today;
  var first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
  var byDay = {};
  list.forEach(function (e) { if (e.date.slice(0, 7) === ym) (byDay[e.date] = byDay[e.date] || []).push(e); });
  var h = '<div class="cal"><div class="cal-g">' + WEEK.map(function (w, i) { return '<div class="cal-w' + (i === 0 ? ' sun' : '') + '">' + w + '</div>'; }).join('');
  for (var i = 0; i < first; i++) h += '<div></div>';
  for (var d = 1; d <= days; d++) {
    var ds = ym + '-' + ('0' + d).slice(-2), evs = byDay[ds] || [];
    var mine = me && evs.some(function (e) { return e.names.indexOf(me) >= 0; });
    var cls = 'cal-d' + (evs.length ? ' has' : '') + (mine ? ' mine' : '') + (ds === today ? ' today' : '') +
      (!past && ds < today ? ' gone' : '') + (((first + d - 1) % 7) === 0 ? ' sun' : '');
    var show = evs.length > 3 ? evs.slice(0, 2) : evs;
    h += '<button class="' + cls + '"' + (evs.length ? ' onclick="jumpDay(' + jsArg(ds) + ')"' : ' disabled tabindex="-1"') +
      ' aria-label="' + esc(m + '月' + d + '日' + (evs.length ? '：' + evs.map(function (e) { return e.title; }).join('、') : '')) + '">' +
      '<span class="n">' + d + '</span>' +
      show.map(function (e) {
        var me1 = me && e.names.indexOf(me) >= 0;
        return '<span class="ev' + (me1 ? ' mine' : '') + '">' + (me1 ? '✓' : '') + esc(shortTitle(e.title)) + '</span>';
      }).join('') +
      (evs.length > show.length ? '<span class="more">還有' + (evs.length - show.length) + '場</span>' : '') + '</button>';
  }
  h += '</div><div class="cal-leg"><span><i style="background:var(--green-soft)"></i>點格子看那天的詳細資訊</span>' +
    (me && !past ? '<span><i style="background:var(--chip-me)"></i>✓ 你有報名</span>' : '') + '</div></div>';
  return h;
}
/* 月曆格子很小：去掉「公民週｜」這類前綴和括號說明，只留活動本身的名字 */
function shortTitle(t) {
  t = String(t || '');
  var i = Math.max(t.lastIndexOf('｜'), t.lastIndexOf('|'));
  if (i >= 0 && i < t.length - 1) t = t.slice(i + 1);
  return t.replace(/[（(][^）)]*[）)]/g, '').replace(/\s+/g, '') || String(arguments[0]).slice(0, 8);
}
function jumpDay(ds) {
  var el = document.getElementById('d-' + ds);
  if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - 6, behavior: 'smooth' });
}

/* ---------- 一次報名多場 ---------- */
function startMulti() { STATE.multi = true; STATE.sel = {}; renderList(false); drawBar(); }
function stopMulti() { STATE.multi = false; STATE.sel = {}; renderList(false); drawBar(); }
function togglePick(id) {
  if (STATE.sel[id]) delete STATE.sel[id]; else STATE.sel[id] = true;
  var y = window.pageYOffset; renderList(false); window.scrollTo(0, y); drawBar();
}
/* 還能報名的場次：開放中、沒額滿、還沒報名（以這支手機記得的名字判斷） */
function canPick(e) {
  if ((STATE.data && STATE.data.isAdmin)) return !e.past;   // 後台：截止、額滿、隱藏的也可以幫忙報
  var me = myName();
  return e.open && !e.full && e.status === '開放' && !(me && e.names.indexOf(me) >= 0);
}
function pickedEvents() {
  return STATE.data.events.filter(function (e) { return STATE.sel[e.id] && ((STATE.data && STATE.data.isAdmin) || (e.open && !e.full)); });
}
function drawBar() {
  var bar = document.getElementById('mbar');
  if (STATE.tab !== 'list') { bar.hidden = true; return; }
  if (!STATE.multi) {   // 平常：底部固定「我要報名／我要取消」，滑到哪裡都按得到
    bar.hidden = false;
    var adm = (STATE.data && STATE.data.isAdmin);   // 後台：幫「一位」志工報名／取消「很多場」
    bar.innerHTML = '<div class="in"><button class="btn btn-go go wrap" onclick="startMulti()">' + ICON.plus + (adm ? '幫志工報名' : '我要報名') + '</button>' +
      '<button class="btn btn-back cx2 wrap" onclick="openMyCancel()">' + ICON.undo + (adm ? '幫志工取消' : '我要取消') + '</button></div>';
    return;
  }
  var n = pickedEvents().length;
  bar.hidden = false;
  bar.innerHTML = '<div class="in"><button class="btn btn-back" onclick="stopMulti()" style="width:auto;margin:0">離開</button>' +
    '<button class="btn btn-go go wrap"' + (n ? '' : ' disabled style="opacity:.45"') + ' onclick="openMultiSubmit()">' +
    (n ? '已選 ' + n + ' 場，' + ((STATE.data && STATE.data.isAdmin) ? '填志工名字' : '填名字報名') : '還沒選任何一場') + '</button></div>';
}
function openMultiSubmit() {
  var evs = pickedEvents();
  if (!evs.length) return;
  var mealEvs = evs.filter(function (e) { return e.lunch || e.breakfast; });
  STATE.mealSel = {}; STATE.mg = {};
  var adm = (STATE.data && STATE.data.isAdmin);
  openSheet('<h2>' + (adm ? '幫志工報名 ' + evs.length + ' 場' : '一次報名 ' + evs.length + ' 場') + '</h2>' +
    '<ul class="res">' + evs.map(function (e) { return '<li><b>' + dayLabel(e.date) + gatherTxt(e) + '</b>' + esc(e.title) + (mealTag(e) ? '<span class="lunchtag">' + mealTag(e) + '</span>' : '') + '</li>'; }).join('') + '</ul>' +
    (adm ? '<label for="nm">志工的名字 <span class="hint">（可以一次填好幾位，用空白或頓號隔開）</span></label><textarea id="nm" rows="2" style="height:76px;min-height:0" placeholder="例如：桃桃、園園" oninput="amPreview()"></textarea><div id="amPv" class="aspv"></div>'
      : '<label for="nm">你的名字 <span class="hint">（請寫全名）</span></label><input id="nm" autocomplete="name" maxlength="12" placeholder="例如：林桃桃" value="' + esc(myName()) + '">') +
    (mealEvs.length ? '<label style="margin-top:18px;display:block">餐點要葷的還是素的？' + (adm ? '<span class="hint">（不知道可以先不選，之後點名字改）</span>' : '') + (mealEvs.length > 1 ? '<span class="hint">（每一場可以選不一樣）</span>' : '') + '</label>' +
      (adm ? '<div id="amMeal"><p class="admin-note">先在上面填名字，這裡就會出現每個人的葷素可以選。</p></div>' :
      mealEvs.map(function (e) {
        return '<div class="mealev" id="me-' + esc(e.id) + '">' + (mealEvs.length > 1 || evs.length > 1 ? '<div class="me-h">' + dayLabel(e.date) + '　' + esc(e.title) + '</div>' : '') +
          (e.breakfast ? '<div class="me-k">早餐</div>' + mealPickHTML(e.id, 'bf') : '') +
          (e.lunch ? '<div class="me-k">便當</div>' + mealPickHTML(e.id, 'lunch') : '') + '</div>';
      }).join('')) : '') +
    '<p class="err" id="err"></p>' +
    '<button class="btn btn-go" id="ok" onclick="doMulti()">送出，全部報名</button>' +
    '<button class="btn btn-back" onclick="closeSheet()">返回修改</button>');
}
function amPreview() {
  var n = splitNamesInput(document.getElementById('nm').value), el = document.getElementById('amPv');
  if (el) el.innerHTML = n.length ? '共 ' + n.length + ' 位：' + n.map(function (x) { return '<span class="chip">' + esc(x) + '</span>'; }).join('') : '';
  var box = document.getElementById('amMeal'); if (!box) return;
  var evs = pickedEvents().filter(function (e) { return e.lunch || e.breakfast; });
  box.innerHTML = n.length ? '<p class="admin-note" style="margin:4px 0">每個人可以選不一樣，不知道的先空著，之後點名字再改。</p>' + evs.map(function (e) {
    return '<div class="mealev">' + (evs.length > 1 ? '<div class="me-h">' + dayLabel(e.date) + '　' + esc(e.title) + '</div>' : '') +
      mgBox('am-' + e.id, n, [e.breakfast ? 'bf' : '', e.lunch ? 'lunch' : ''].filter(Boolean)) + '</div>';
  }).join('') : '<p class="admin-note">先在上面填名字，這裡就會出現每個人的葷素可以選。</p>';
}
function doMulti() {
  if (STATE.busy) return;
  var adm0 = (STATE.data && STATE.data.isAdmin), raw = document.getElementById('nm').value;
  var name = adm0 ? splitNamesInput(raw) : clean(raw);
  if (!name || !name.length) { document.getElementById('err').textContent = '請先填名字'; return; }
  if (adm0) { var badN = name.filter(function (n) { return !NAME_RE.test(n); }); if (badN.length) { document.getElementById('err').textContent = '名字只能用文字（不要放符號）：' + badN.join('、'); return; } }
  var sel = STATE.mealSel || {}, miss = null;
  pickedEvents().forEach(function (e) {
    var m = sel[e.id] || {};
    if (!miss && ((e.breakfast && !m.bf) || (e.lunch && !m.lunch))) miss = e;
  });
  if (miss && !(STATE.data && STATE.data.isAdmin)) {
    var m0 = sel[miss.id] || {}, what = [miss.breakfast && !m0.bf ? '早餐' : '', miss.lunch && !m0.lunch ? '便當' : ''].filter(Boolean).join('和');
    document.getElementById('err').textContent = '還沒選「' + dayLabel(miss.date) + ' ' + miss.title + '」的' + what + '要葷、素或不用';
    var blk = document.getElementById('me-' + miss.id);
    if (blk) { blk.classList.add('need'); blk.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    return;
  }
  var ids = pickedEvents().map(function (e) { return e.id; });
  busy(true, '送出中…');
  var adm = (STATE.data && STATE.data.isAdmin);
  if (adm) {   // 後台：每個人的葷素
    sel = {};
    pickedEvents().forEach(function (e) {
      var g = STATE.mg['am-' + e.id] || {}; sel[e.id] = {};
      name.forEach(function (n) { if (g[n]) sel[e.id][n] = { lunch: g[n].lunch || '', bf: g[n].bf || '' }; });
    });
  }
  (adm ? call('adminSignupMany', STATE.adminKey, ids, name, sel) : call('signupMany', ids, name, sel)).then(function (d) {
    if (!adm && !myName()) saveName(name);
    var res = d.results || []; delete d.results;
    keepAdmin(d); STATE.multi = false; STATE.sel = {}; drawBar(); render();
    var ok = res.filter(function (r) { return r.ok; }).length;
    openSheet('<h2>' + (ok === res.length ? '✅ 全部報名成功！' : '報名結果') + '</h2>' +
      '<p class="ctx">' + (adm ? '成功 ' + ok + ' 筆' + (ok < res.length ? '，有 ' + (res.length - ok) + ' 筆沒有報到' : '') : esc(name) + '，成功 ' + ok + ' 場' + (ok < res.length ? '，有 ' + (res.length - ok) + ' 場沒有報到' : '')) + '</p>' +
      '<ul class="res">' + res.map(function (r) {
        return '<li><b>' + (r.ok ? '✅ ' : '⚠️ ') + (r.date ? dayLabel(r.date) : '') + (r.name && adm ? '　' + esc(r.name) : '') + '</b>' + esc(r.title) +
          (r.ok ? (r.wait ? '（候補）' : '') + (r.bf ? '<br><span class="lunchtag">早餐：' + esc(r.bf === '不用' ? '不用' : r.bf + '食') + '</span>' : '') + (r.meal ? (r.bf ? ' ' : '<br>') + '<span class="lunchtag">便當：' + esc(r.meal === '不用' ? '不用' : r.meal + '食') + '</span>' : '') : '<br><span class="bad">' + esc(r.msg) + '</span>') + '</li>';
      }).join('') + '</ul>' +
      '<button class="btn btn-go" onclick="closeSheet()">好</button>');
  }).catch(function (e) { document.getElementById('err').textContent = e.message; })
    .then(function () { busy(false, '送出，全部報名'); });
}

/* ---------- 早餐、便當（葷／素／不用），每場各自選 ---------- */
var MEAL_NAME = { lunch: '便當', bf: '早餐' };
/* STATE.mealSel = { 場次編號: { lunch: '葷', bf: '素' } } */
function mealPickHTML(id, kind, allowBlank) {
  var cur = ((STATE.mealSel || {})[id] || {})[kind];
  var opts = [['葷', '葷食'], ['素', '素食'], ['不用', '不用' + MEAL_NAME[kind]]];
  if (allowBlank) opts.push(['', '先不填']);
  return '<div class="mealpick">' + opts.map(function (o) {
    return '<button type="button" class="' + (cur === o[0] ? 'on' : '') + '" onclick="pickMeal(' + jsArg(o[0]) + ', this, ' + jsArg(id) + ', ' + jsArg(kind) + ')">' + o[1] + '</button>';
  }).join('') + '</div>';
}
function pickMeal(v, el, id, kind) {
  STATE.mealSel = STATE.mealSel || {};
  (STATE.mealSel[id] || (STATE.mealSel[id] = {}))[kind] = v;
  var box = el.parentNode; [].forEach.call(box.children, function (b) { b.className = ''; }); el.className = 'on';
  var blk = box.closest ? box.closest('.mealev') : null; if (blk) blk.classList.remove('need');
  var er = document.getElementById('err'); if (er) er.textContent = '';
}
function openSetMeal(id, name) {
  var e = findEvent(id);
  STATE.mealSel = {}; STATE.mealSel[id] = { lunch: (e.meals || {})[name] || '', bf: (e.bfs || {})[name] || '' };
  STATE.smName = name; STATE.smId = id;
  openSheet('<h2>改「' + esc(name) + '」的餐點</h2><p class="ctx">' + dayLabel(e.date) + '　' + esc(e.title) + '</p>' +
    (e.breakfast ? '<div class="me-k">早餐</div>' + mealPickHTML(id, 'bf') : '') +
    (e.lunch ? '<div class="me-k">便當</div>' + mealPickHTML(id, 'lunch') : '') +
    '<p class="err" id="err"></p>' +
    '<button class="btn btn-go" id="ok" onclick="doSetMeal()">儲存</button><button class="btn btn-back" onclick="closeSheet()">取消</button>');
}
function doSetMeal() {
  if (STATE.busy) return;
  var m = STATE.mealSel[STATE.smId] || {};
  busy(true, '儲存中…');
  call('setMeal', STATE.adminKey, STATE.smId, STATE.smName, m.lunch || '', m.bf || '').then(function (d) {
    STATE.data = d; closeSheet(); render(); toast('已改好「' + STATE.smName + '」的餐點');
  }).catch(function (e) { document.getElementById('err').textContent = e.message; }).then(function () { busy(false, '儲存'); });
}
function mealTag(e) {   // 卡片上的小標籤
  var k = [e.breakfast ? '早餐' : '', e.lunch ? '便當' : ''].filter(Boolean);
  return k.length ? '有' + k.join('、') : '';
}
/* 某一場的統計：{葷:3, 素:1, 不用:0, 未選:0}；kind = 'lunch' 便當／'bf' 早餐 */
/* ---------- 葷素表格：一次幫很多人選（每個人一列，點一下選、再點一下取消） ---------- */
STATE.mg = {};
function mealGridHTML(gid, names, kinds) {
  var d = STATE.mg[gid] || (STATE.mg[gid] = {});
  if (!names.length || !kinds.length) return '';
  var KN = { bf: '早餐', lunch: '便當' };
  var seg = function (n, k) {
    var cur = (d[n] || {})[k] || '';
    return '<span class="mgseg">' + [['葷', '葷'], ['素', '素'], ['不用', '不用']].map(function (o) {
      return '<button type="button" class="' + (cur === o[0] ? 'on v-' + (o[0] === '葷' ? 'h' : o[0] === '素' ? 'v' : 'n') : '') + '" onclick="mgSet(' + jsArg(gid) + ',' + jsArg(n) + ',' + jsArg(k) + ',' + jsArg(o[0]) + ')">' + o[1] + '</button>';
    }).join('') + '</span>';
  };
  return '<table class="mg"><tr><th></th>' + kinds.map(function (k) { return '<th>' + KN[k] + '</th>'; }).join('') + '</tr>' +
    (names.length > 1 ? '<tr class="mgall"><td>全部都</td>' + kinds.map(function (k) {
      return '<td><span class="mgseg">' + ['葷', '素'].map(function (v) { return '<button type="button" onclick="mgAll(' + jsArg(gid) + ',' + jsArg(k) + ',' + jsArg(v) + ')">' + v + '</button>'; }).join('') + '</span></td>';
    }).join('') + '</tr>' : '') +
    names.map(function (n) { return '<tr><td class="mgn">' + esc(n) + '</td>' + kinds.map(function (k) { return '<td>' + seg(n, k) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>';
}
function mgSet(gid, n, k, v) {
  var d = STATE.mg[gid] || (STATE.mg[gid] = {}), x = d[n] || (d[n] = {});
  x[k] = x[k] === v ? '' : v;   // 再點一次＝取消選擇
  mgRedraw(gid);
}
function mgAll(gid, k, v) {
  var d = STATE.mg[gid] || (STATE.mg[gid] = {}), box = document.getElementById('mg-' + gid);
  (box ? JSON.parse(box.getAttribute('data-names') || '[]') : []).forEach(function (n) { (d[n] || (d[n] = {}))[k] = v; });
  mgRedraw(gid);
}
function mgRedraw(gid) {
  var box = document.getElementById('mg-' + gid); if (!box) return;
  box.innerHTML = mealGridHTML(gid, JSON.parse(box.getAttribute('data-names') || '[]'), JSON.parse(box.getAttribute('data-kinds') || '[]'));
}
function mgBox(gid, names, kinds) {
  return '<div class="mgbox" id="mg-' + esc(gid) + '" data-names="' + esc(JSON.stringify(names)) + '" data-kinds="' + esc(JSON.stringify(kinds)) + '">' + mealGridHTML(gid, names, kinds) + '</div>';
}
function mealCount(e, kind) {
  var c = { '葷': 0, '素': 0, '不用': 0, '未選': 0 }, m = (kind === 'bf' ? e.bfs : e.meals) || {};
  e.names.forEach(function (n) { var v = m[n]; c[v === '葷' || v === '素' || v === '不用' ? v : '未選']++; });
  if (e.staffMeals) (e.staff || []).forEach(function (n) { var v = (e.staffMeals[n] || {})[kind]; c[v === '葷' || v === '素' || v === '不用' ? v : '未選']++; c.staff = (c.staff || 0) + (v === '葷' || v === '素' ? 1 : 0); });   // 工作人員也算進去
  return c;
}
function mealSumTxt(e, kind) {
  var c = mealCount(e, kind);
  return '葷 ' + c['葷'] + '、素 ' + c['素'] + (c['不用'] ? '、不用 ' + c['不用'] : '') + (c['未選'] ? '、沒選 ' + c['未選'] : '');
}
function mealDetail(e, kind) {
  var c = mealCount(e, kind);
  return mealSumTxt(e, kind) + '　共 ' + (c['葷'] + c['素']) + ' 份' + (c.staff ? '（含工作人員 ' + c.staff + ' 份）' : '');
}

/* ---------- 我要取消：輸入名字 → 列出報名的場次 → 取消 ---------- */
function cxModeBar(m) {   // 後台取消：兩種方式切換
  return '<div class="cxmode"><button class="' + (m === 'name' ? 'on' : '') + '" onclick="openMyCancel()">一位志工<br>取消多場</button>' +
    '<button class="' + (m === 'event' ? 'on' : '') + '" onclick="openCancelByEvent()">一場活動<br>取消多位志工</button></div>';
}
function openCancelByEvent() {
  var evs = STATE.data.events.filter(function (e) { return e.names.length; });
  openSheet('<h2>幫志工取消</h2>' + cxModeBar('event') +
    '<p class="ctx">選一場活動，再勾要取消的志工：</p>' +
    (evs.length ? '<ul class="evpick">' + evs.map(function (e) {
      return '<li><button class="pickev" onclick="openAdminCancel(' + jsArg(e.id) + ')"><b>' + dayLabel(e.date) + gatherTxt(e) + '</b>' + esc(e.title) + '<small>已報名 ' + e.names.length + ' 位：' + esc(e.names.slice(0, 6).join('、')) + (e.names.length > 6 ? '…' : '') + '</small></button></li>';
    }).join('') + '</ul>' : '<p class="ctx">目前沒有場次有人報名。</p>') +
    '<button class="btn btn-back" onclick="closeSheet()">關閉</button>');
}
function openMyCancel(prefill) {
  var adm = (STATE.data && STATE.data.isAdmin);
  openSheet('<h2>' + (adm ? '幫志工取消' : '我要取消') + '</h2>' + (adm ? cxModeBar('name') : '') + '<p class="ctx">' + (adm ? '打志工的名字（打其中一個字也可以），會列出他報名的所有場次，可以一次勾很多場取消。' : '輸入名字，打其中一個字也可以，就會列出報名的場次。') + '</p>' +
    '<label for="cn">' + (adm ? '志工的名字' : '你的名字') + '</label><input id="cn" autocomplete="' + (adm ? 'off' : 'name') + '" maxlength="12" placeholder="例如：桃桃" value="' + esc(prefill || (adm ? '' : myName())) + '">' +
    '<p class="err" id="err"></p>' +
    '<button class="btn btn-go" id="ok" onclick="showMySignups()">' + (adm ? '查詢' : '查詢我的報名') + '</button>' +
    '<button class="btn btn-back" onclick="closeSheet()">返回</button>');
  var i = document.getElementById('cn');
  i.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') showMySignups(); });
  setTimeout(function () { i.focus(); }, 250);
}
function showMySignups(q) {
  q = clean(q != null ? q : document.getElementById('cn').value);
  if (!q) { document.getElementById('err').textContent = '請先填名字'; return; }
  // 跟搜尋一樣：名字裡有這個字就列出來（打「桃」會找到「桃桃」「林桃桃」）
  var found = [], ql = q.toLowerCase(), adm = (STATE.data && STATE.data.isAdmin);
  STATE.data.events.forEach(function (e) {
    var evHit = adm && (e.title + ' ' + (e.place || '')).toLowerCase().indexOf(ql) >= 0;   // 後台：打活動名稱也找得到
    e.names.forEach(function (n) { if (evHit || n.toLowerCase().indexOf(ql) >= 0) found.push({ id: e.id, name: n, e: e }); });
  });
  STATE.cancelQ = q; STATE.cxFinder = true;
  STATE.cxItems = found;
  openSheet('<h2>' + (adm ? '「' + esc(q) + '」的報名' : '名字有「' + esc(q) + '」的報名') + '</h2>' +
    (found.length ? '<p class="ctx">勾選要取消的場次（可以勾很多場），請看清楚「登記的名字」' + ((STATE.data && STATE.data.isAdmin) ? '是不是這位志工' : '是不是你') + '。</p>' + cxListHTML(found, (STATE.data && STATE.data.isAdmin)) +
      '<p class="err" id="err"></p>' +
      '<button class="btn btn-danger" id="okCx" onclick="reviewCancel(' + ((STATE.data && STATE.data.isAdmin) ? 'true' : 'false') + ')" disabled style="opacity:.45">請先勾選要取消的場次</button>'
    : '<p class="ctx">找不到' + (adm ? '符合「' + esc(q) + '」的報名' : '「' + esc(q) + '」報名的場次') + '。<br>請確認名字跟報名時一樣，或聯絡工作人員。</p>') +
    '<button class="btn btn-back" onclick="openMyCancel(' + jsArg(q) + ')">' + (adm ? '換一個關鍵字' : '換一個名字') + '</button>' +
    '<button class="btn btn-back" onclick="closeSheet()">關閉</button>');
}
/* 可勾選的取消清單。admin=true 時，今天或已截止的也能勾 */
function cxListHTML(items, admin) {
  return '<ul class="mylist">' + items.map(function (f, i) {
    var e = f.e, can = admin || e.open;
    return '<li><label class="cxrow' + (can ? '' : ' off') + '">' +
      (can ? '<input type="checkbox" class="cxchk" data-i="' + i + '" onchange="cxCount(' + (admin ? 1 : 0) + ')">' : '') +
      '<div class="info"><b>' + dayLabel(e.date) + gatherTxt(e) + '</b>' + esc(e.title) +
      '<small>登記的名字：<b style="display:inline;color:var(--ink)">' + esc(f.name) + '</b></small>' +
      (can ? '' : '<small>已停止線上登記，請聯絡工作人員</small>') + '</div></label></li>';
  }).join('') + '</ul>';
}
function cxChecked() {
  return Array.prototype.slice.call(document.querySelectorAll('.cxchk:checked')).map(function (c) { return STATE.cxItems[+c.getAttribute('data-i')]; });
}
function cxCount(admin) {
  var n = cxChecked().length, b = document.getElementById('okCx');
  b.disabled = !n; b.style.opacity = n ? '' : '.45';
  b.textContent = n ? '取消勾選的 ' + n + ' 筆' : (admin ? '請先勾選要取消的志工' : '請先勾選要取消的場次');

/* 活動時間分三行：開始時間、一條短直線、結束時間 */

  return String(t).replace(/(\d{1,2})\s*點\s*(半|(\d{1,2})\s*分?)?/g, function (_, h, x, mm) {
    return h + ':' + (x === '半' ? '30' : mm ? ('0' + mm).slice(-2) : '00');
  });
}
function timeHTML(t) {
  t = normTime(t).replace(/(\d)\s*[:：]\s*(\d)/g, '$1:$2');   // 「10: 00」「10：00」也能認

  return pad(m[1]) + '<i class="vl" aria-label="到"></i>' + pad(m[2]);   // 三行：開始／直線／結束
}

/* ---------- 共用小元件 ---------- */
function openSheet(html) {
  var sh = document.getElementById('sheet'), m = document.getElementById('modal'), wasOpen = m.className === 'open', y = sh.scrollTop;
  sh.innerHTML = html; m.className = 'open';
  sh.scrollTop = wasOpen ? y : 0;   // 視窗已經開著（例如勾志工）就停在原位
  fitSheet();

/* 手機跳出鍵盤時：彈出視窗往上移到鍵盤上面，打字的框框捲到看得見的位置（字體調很大也一樣） */
function fitSheet() {
  var sh = document.getElementById('sheet'), vv = window.visualViewport;
  if (!sh) return;
  if (!vv) { sh.style.maxHeight = ''; sh.style.bottom = ''; return; }
  var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);   // 鍵盤高度
  sh.style.bottom = kb + 'px';
  sh.style.maxHeight = Math.max(200, vv.height - 12) + 'px';
}
function keepFocusVisible() {
  var el = document.activeElement, sh = document.getElementById('sheet');
  if (!el || !sh || !sh.contains(el) || !/^(INPUT|TEXTAREA)$/.test(el.tagName)) return;
  fitSheet();
  var top = el.offsetTop - 12;   // 輸入框連同上面的標題一起露出來
  var lab = el.previousElementSibling; if (lab && lab.tagName === 'LABEL') top = lab.offsetTop - 12;
  if (sh.scrollHeight > sh.clientHeight + 4) sh.scrollTop = Math.max(0, top);   // 把「你的名字」捲到視窗最上面，下面的按鈕也露出來
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function () { fitSheet(); setTimeout(keepFocusVisible, 50); });
  window.visualViewport.addEventListener('scroll', fitSheet);
}
document.addEventListener('focusin', function () { setTimeout(keepFocusVisible, 300); });
function closeSheet() { document.getElementById('modal').className = ''; var sh = document.getElementById('sheet'); sh.style.bottom = ''; sh.style.maxHeight = ''; }

function saveForm(id) {
  if (STATE.busy) return;
  var g = function (k) { return document.getElementById(k).value.trim(); };
  var start = g('fStart'), end = g('fEnd');
  var ev = { id: id, date: g('fDate'), title: g('fTitle'), gather: g('fGather'),

    need: g('fNeed'), note: g('fNote'), staff: g('fStaff'), status: g('fStatus'), lunch: document.getElementById('fLunch').checked, breakfast: document.getElementById('fBf').checked };
  ev.staffMeals = {};

  if (!ev.title) { err.textContent = '請填活動名稱'; return; }

function toMin(x) { var m = String(x || '').match(/(\d{1,2}):(\d{2})/); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function eventHours(e) {
  var t = normTime(e.time || '').replace(/(\d)\s*[:：]\s*(\d)/g, '$1:$2');
  var all = t.match(/\d{1,2}:\d{2}/g) || [];
  var end = all.length >= 2 ? toMin(all[all.length - 1]) : null;
  var start = toMin(normTime(e.gather || '').replace(/(\d)\s*[:：]\s*(\d)/g, '$1:$2'));
  if (start == null && all.length) start = toMin(all[0]);   // 沒寫集合時間，就從活動開始算
  if (start == null || end == null || end <= start) return null;

}
function fmtH(h) { return (Math.round(h * 100) / 100).toString(); }
function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

    if (seen[e.id] || e.date < from || e.date > to) return;
    seen[e.id] = 1; evs.push(e);
